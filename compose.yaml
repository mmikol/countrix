# .venv/bin/python orchestrator.py  ->  one container per role:
#
#   db          PostgreSQL
#   data        the door: builds the database from the bind-mounted page
#               caches when it is empty, migrates it in place when it is
#               stale, then serves every MCP tool at
#               http://localhost:8020/mcp (.mcp.json, server
#               "countrix-docker")
#   ui          the board at http://localhost:8017, with the INFERENCE ENGINE
#               in the board's process, reading the strategy files live
#   refresher   the door's clock: patches and rates daily at
#               COUNTRIX_REFRESH_AT (05:00 container time; set TZ), every
#               source weekly, and on start when the caches are 20 hours old
#   backup      the nightly pg_dump into ./backups at COUNTRIX_BACKUP_AT
#               (04:30 container time), the newest 14 kept: the dated rates
#               history a rebuild drops and no source gives back; before
#               data rebuilds a schema whose migration failed it asks for
#               one more, which the rotation keeps
#
# Every container but db runs as an unprivileged user on a read-only root
# filesystem, with every capability dropped, no new privileges and process
# and memory limits. db takes no new privileges and keeps only the five
# capabilities its image needs to start as root and drop to postgres (below).
# Every container but ui shares the stack network; ui shares reader with db
# alone, so the board reaches the database and never the door on data:8020.
# Only data and refresher open a connection out, to two fixed hosts. Every
# published port binds to 127.0.0.1. No keys, no accounts.
# COUNTRIX_MCP_TOKEN (in .env) requires a bearer token on the MCP server.
# One image, built once by `data`, shared by every container but db and
# backup, which run postgres's own; each container mounts only what it reads,
# read-only unless it writes there.
name: countrix

x-app: &app
  image: countrix
  # the checkout's owner on a Linux host, so the bind mounts stay writable
  user: "${COUNTRIX_UID:-1000}:${COUNTRIX_GID:-1000}"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        memory: 1g
        pids: 256
  networks: [stack]
  environment: &env
    DATABASE_URL: postgresql://overwatch:${POSTGRES_PASSWORD:-overwatch}@db/overwatch
    # another playbook: a folder under the repo (empty: inference/strategies)
    COUNTRIX_STRATEGIES: ${COUNTRIX_STRATEGIES:-}

networks:
  stack: {}
  reader: {}                  # the board's: db and ui alone, routable so ui's port publishes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overwatch}
      POSTGRES_DB: overwatch
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                  # what the image needs to start as root and drop to postgres
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks: [stack, reader]
    ports:
      - "127.0.0.1:5433:5432"        # host-side tools via ./docker-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 2s
      timeout: 3s
      retries: 30

  data:
    <<: *app
    deploy:                          # the door's solves: a board's exact
      resources:                     # searches hold its top sixes, not a field
        limits:
          memory: 2g
          pids: 256
    build: .
    command: ["data"]
    environment:
      <<: *env
      COUNTRIX_MCP_TOKEN: ${COUNTRIX_MCP_TOKEN:-}
    volumes:                         # every tool lands here: the pulls, a tune, a draft, the docs
      - ./.cache-blizzard:/app/.cache-blizzard
      - ./.cache-wiki:/app/.cache-wiki
      - ./inference/strategies:/app/inference/strategies
      - ./docs:/app/docs
      - ./backups:/backups           # a rebuild's request for backup's dump, and its answer
    ports:
      - "127.0.0.1:8020:8020"        # MCP over HTTP: /mcp, /health
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy once the MCP server answers and the database's state is
      # current (db.psql.schema.state: built, migrated, filled)
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8020/health'));assert d.get('state')=='current'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s   # the first build scrapes the sources

  ui:
    <<: *app
    deploy:                          # the engine in the board's process, one board
      resources:                     # solving at a time (ui/serve.py)
        limits:
          memory: 2g
          pids: 256
    command: ["ui"]
    # db alone, never the door: a compromised board holds matrix_reader and no tool
    networks: [reader]
    volumes:                      # the playbook, read-only; everything else comes from the database
      - ./inference/strategies:/app/inference/strategies:ro
    ports:
      - "127.0.0.1:8017:8017"
    environment:
      <<: *env
      # the board reads as matrix_reader (migrations 011 and 012), a login
      # the database holds to SELECT, each statement under 10 s
      DATABASE_URL: postgresql://matrix_reader:matrix_reader@db/overwatch
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      # the engine's health: the playbook loads and the database answers.
      # Nothing waits on it; `docker compose ps` and orchestrator.py read it
      test: ["CMD", "python", "-c",
             "import json,urllib.request;d=json.load(urllib.request.urlopen('http://localhost:8017/health'));assert d['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  refresher:
    <<: *app
    command: ["refresh"]
    volumes:                      # pulls into the caches; reads the playbook
      - ./.cache-blizzard:/app/.cache-blizzard
      - ./.cache-wiki:/app/.cache-wiki
      - ./inference/strategies:/app/inference/strategies:ro
    environment:
      <<: *env
      COUNTRIX_REFRESH_AT: ${COUNTRIX_REFRESH_AT:-05:00}
      TZ: ${TZ:-UTC}
    depends_on:
      data:
        condition: service_healthy

  backup:
    # postgres's own image, for its pg_dump; no port, and the one host it
    # reaches is db
    image: postgres:16-alpine
    user: "${COUNTRIX_UID:-1000}:${COUNTRIX_GID:-1000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/postgresql/data    # the image's VOLUME: a tmpfs here, so no anonymous volume
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 64
    networks: [stack]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-overwatch}
      TZ: ${TZ:-UTC}
      COUNTRIX_BACKUP_AT: ${COUNTRIX_BACKUP_AT:-04:30}
    volumes:                      # made by orchestrator.py up, so the checkout's owner owns it
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # A dump on start when today's is missing, then one a night once the
    # clock passes COUNTRIX_BACKUP_AT: pg_dump's custom format into a hidden
    # .part file, renamed once whole, 0600 under umask 077, the newest 14
    # countrix-*.dump kept. A dump that fails is tried twice more, a minute
    # and two apart. The loop wakes every 15 s and reads the wall clock, so
    # a host that slept past the time dumps on waking. A request from data
    # (/backups/.predump: a rebuild is about to drop the rates history) is
    # answered with prerebuild-<date>T<time>.dump, which no rotation prunes,
    # and the result in /backups/.predump.done. Every sleep runs as
    # `sleep N & wait` so TERM and INT end it at once, exit 0. The block
    # folds its lines together, so every statement ends in `;` and none is
    # a shell comment; `$$` is compose's escape for the shell's `$`.
    command:
      - >
        umask 077;
        case "$$COUNTRIX_BACKUP_AT" in
            [01][0-9]:[0-5][0-9] | 2[0-3]:[0-5][0-9]) ;;
            *) echo "backup: COUNTRIX_BACKUP_AT must be HH:MM, got '$$COUNTRIX_BACKUP_AT'" >&2; exit 1 ;;
        esac;
        trap 'exit 0' TERM INT;
        dump() {
            case "$$1" in
                countrix) stamp=$$(date +%Y-%m-%d) ;;
                *) stamp=$$(date +%Y-%m-%dT%H%M%S) ;;
            esac;
            file=/backups/$$1-$$stamp.dump;
            part=/backups/.$$1-$$stamp.dump.part;
            tries=1;
            until pg_dump -h db -U overwatch -d overwatch -Fc -f "$$part"; do
                rm -f "$$part";
                if [ "$$tries" -ge 3 ]; then
                    echo "backup: pg_dump failed $$tries times, $$file not written" >&2;
                    return 1;
                fi;
                echo "backup: pg_dump failed, trying again in $$((tries * 60)) s" >&2;
                sleep $$((tries * 60)) & wait;
                tries=$$((tries + 1));
            done;
            mv "$$part" "$$file";
            ls -1 /backups/countrix-*.dump | sort -r | tail -n +15 | xargs -r rm -f;
            echo "backup: $$file, $$(du -k "$$file" | cut -f1) KB";
        };
        answer() {
            [ -e /backups/.predump ] || return 0;
            if dump prerebuild; then
                echo "ok $$file" > /backups/.predump.done;
            else
                echo "failed" > /backups/.predump.done;
            fi;
            rm -f /backups/.predump;
        };
        echo "backup: daily at $$COUNTRIX_BACKUP_AT ($$TZ), the newest 14 kept";
        rm -f /backups/.*.dump.part;
        [ -e "/backups/countrix-$$(date +%Y-%m-%d).dump" ] || dump countrix;
        due=$$(date -d "$$COUNTRIX_BACKUP_AT" +%s) || exit 1;
        last=;
        [ "$$(date +%s)" -lt "$$due" ] || last=$$(date +%Y-%m-%d);
        while :; do
            answer;
            today=$$(date +%Y-%m-%d);
            if [ "$$last" != "$$today" ]; then
                due=$$(date -d "$$COUNTRIX_BACKUP_AT" +%s) || exit 1;
                if [ "$$(date +%s)" -ge "$$due" ]; then
                    dump countrix;
                    last=$$today;
                fi;
            fi;
            sleep 15 & wait;
        done
    healthcheck:
      # healthy while the newest dump is under 26 hours old, so a missed
      # night shows. Nothing waits on it; `docker compose ps` and
      # orchestrator.py read it
      test: ["CMD-SHELL", "find /backups -name 'countrix-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  pgdata:
